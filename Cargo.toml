[package]
name = "libzcashlc"
version = "5.0.0"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre"
]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.91"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.16" }
# `asm` selects the assembly field arithmetic, where most of 0.6.1's speedup is; without it every
# target gets the portable arithmetic. pasta_curves picks the backend per target itself and has
# none for Apple's x86-64 targets, so the x86_64 slices stay portable. 0.6.0 has no such feature.
pasta_curves = { version = "0.6.1", features = ["asm"] }
ff = "0.14"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
# The scalar types in the Sapling prover traits, named by `rust/src/sapling_prover.rs`.
bls12_381 = "0.9"
jubjub = "0.11"
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.1", default-features = false }
zcash_address = { version = "=0.14.0-pre.1" }
zcash_client_backend = { version = "=0.25.0-pre.1", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "=0.31.0-pre.1"
zcash_proofs = "=0.31.0-pre.1"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_pool_migration = { version = "=0.2.0-pre.1", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "=0.10.0-pre.1", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# Ledger hardware-wallet signing over Bluetooth LE (`rust/src/ledger.rs`).
#
# The sans-I/O APDU engine for the Ledger Zcash app: pairing commands, BLE framing and the PCZT
# signing session. Default features only (`std`); the USB HID and speculos transports stay off,
# since the platform layer moves the bytes. Published from the public zodl-inc/pczt-ledger
# repository.
pczt_ledger = "=0.1.0-pre.0"

# Payment URI parsing (Bitcoin/Litecoin, EIP-681, Solana Pay).
# TODO: temporary git-rev pin -- switch to a published crates.io release once payment_uri ships
# one. Pinned to the zcash/librustzcash#2989 merge commit specifically (not main's moving tip),
# so this doesn't pick up unrelated later changes; that merge commit is a permanent part of
# main's history now, so it stays reachable even as main moves on. iOS keeps 330e4c0a on purpose:
# moving payment_uri would also move eip681, whose parsing changed in later revisions (a stricter
# address-length check, and `from_parts` constructors in place of `from_native_request_parts` and
# `from_erc20_request_parts`), and this SDK's payment-URI parsing would change with it.
eip681 = { git = "https://github.com/zcash/librustzcash.git", rev = "330e4c0aa9e25199acdb93a56bf70126d0d3f2b9" }
payment_uri = { git = "https://github.com/zcash/librustzcash.git", rev = "330e4c0aa9e25199acdb93a56bf70126d0d3f2b9", features = ["json"] }

# Gift cards (`rust/src/liberated_payment.rs`): payment secrets are BIP 39 entropy encoded as
# Bech32m. Descriptions are percent-encoded and legacy payloads are base64url (`base64`, below);
# both crates are librustzcash dependencies already in the lockfile.
bech32 = "0.11"
bip0039 = { version = "0.14", default-features = false, features = ["std"] }
percent-encoding = "2"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
libc = "0.2"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting
#
# Coinholder voting core: the zcash_voting 5.x round driver. The `lrz` feature
# selects the librustzcash backend so the crate shares this package's
# zcash_client_sqlite / orchard family instead of pulling the zakura forks.
# Pinned exactly, like every voting release this package has taken: the sidecar
# schema and the wire views move with the crate, so an upgrade is a reviewed change.
#
# 5.1.1-rc.3 here is not the crates.io release: `[patch.crates-io]` below takes it from the head
# of valargroup/zcash_voting#373, which moves the `lrz` backend to the NU7 pre-release crates.
zcash_voting = { version = "=5.1.1-rc.3", default-features = false, features = ["lrz"] }
zeroize = "1"

# Used by the pool-migration engine as well as by voting.
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

# Slipstream engine — the alternative sync engine the SlipstreamSynchronizer
# drives, published to crates.io as `zodl-slipstream` from zodl-inc/slipstream.
# 0.4.0-pre.2 is built against the NU7 pre-release crates, the same
# librustzcash generation as this package, so the graph stays a single
# family instance. The `[patch.crates-io]` entry below replaces the published
# crate with a revision that implements `WalletWrite::set_account_name`.
slipstream-core = { version = "=0.4.0-pre.2", package = "zodl-slipstream" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
hex = "0.4"

# Shared OHTTP (RFC 9458) client core, sans-IO: the Android, iOS and Slipstream clients run the same
# key-configuration selection, signed-envelope check, Binary HTTP codec, HPKE sealing and outer
# status rules. The Swift SDK keeps the I/O (URLSession, Tor) and calls this through the
# `zcashlc_ohttp_*` C functions. It is a private repository, so cargo needs the same read token as
# `slipstream-core` (see `.github/actions/authorize-slipstream`). Pinned by commit: a stale hash
# fails loudly, a branch would follow a force-push. b0b2087c: DNS fallback for signed key configuration.
zodl-ohttp-client = { git = "https://github.com/zodl-inc/ohttp.git", rev = "b0b2087c9d867115f38ddfbd6021988b64abf8f9", default-features = false }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Plays the device in the Ledger signing tests (`rust/src/ledger/tests.rs`). Matches the engine's
# own secp256k1 (via zcash_transparent) so the two stay one dependency instance, not two.
secp256k1 = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "test-util"] }

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

# GPU-accelerated Orchard subtree building in the engine (wgpu). OFF by
# default — the released libzcashlc links zero wgpu. Enable for local device
# builds via Scripts/init-local-ffi.sh --gpu / rebuild-local-ffi.sh --gpu.
gpu = ["slipstream-core/gpu"]

# Lets zcashlc_set_default_ohttp_client_trace_prefix set OHTTP client trace ids;
# without it the call is ignored. QA/E2E builds only (ohttp-e2e.yml,
# init-local-ffi.sh / rebuild-local-ffi.sh --trace,
# make ffi-macos FFI_CARGO_FEATURES=ohttp-trace);
# release builds (build-ffi.yml, prepare-release.sh) never enable it.
ohttp-trace = []

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

# Build scripts and proc macros, which run on the build machine, stay unstripped. A release build
# strips them by default, and on macOS rustc does that with its bundled rust-objcopy, which writes
# the Mach-O string table straight after the indirect symbol table without padding it to 8 bytes,
# so the string table is misaligned whenever the indirect symbol table has an odd number of
# entries. macOS 27's dyld refuses to load such a proc macro, and the build fails with "mis-aligned
# LINKEDIT string pool" or "can't find crate". BuildSupport/Makefile's MACOSX_DEPLOYMENT_TARGET
# reaches them too, and linked for macOS 14 every one of them came out misaligned. The linker's own
# output is aligned. The static libraries the SDK ships were never stripped, so this setting does
# not apply to them.
[profile.release.build-override]

[patch.crates-io]
# Slipstream 0.4.0-pre.2 OHTTP transport (zodl-inc/slipstream-internal PR #26) with
# zodl-inc/slipstream 58647969 merged (the public facades that implement
# `WalletWrite::set_account_name`, which main now requires). slipstream-internal rev
# 1218755d replaces both the published `zodl-slipstream` and main's public patch: it
# contains our OHTTP connector frozen at f3e1f765, measured per-chunk scan CPU,
# bounded enhancement fetches with per-txid retry, one h2 dial per relay at a time,
# mempool re-arm after outage, relay dispatch hook before sealed request write, HTTP
# answer read up to caller's ceiling, and `set_account_name` facades.
zodl-slipstream = { git = "https://github.com/zodl-inc/slipstream-internal.git", rev = "1218755d0440597e749f9f401ad90e8663240873" }

# Coinholder voting on the NU7 pre-release crates.
#
# No `zcash_voting` release is built on the NU7 crates yet, and the crate is not ours to publish,
# so it and the crates under it come from the heads of the pull requests that move them there.
# A `[patch]` table in a dependency's own workspace does not reach its consumers, so this repeats
# the entries of the table valargroup/zcash_voting#373 carries that this package's graph uses, at
# the same revisions. That table also patches the Zakura crates (zakura-core/common#538); they
# are optional dependencies only the `zakura` backend enables, so with `lrz` they never enter
# this lockfile and need no entry here. Replace each entry with the release that contains its
# pull request, and drop the table once all of them are out.
#
# valargroup/zcash_voting#373
zcash_voting = { git = "https://github.com/zodl-inc/zcash_voting", rev = "9bb376295431a3c73a260ed6bbbcc870284f2db3" }
# valargroup/voting-circuits#135
voting-circuits = { git = "https://github.com/zodl-inc/voting-circuits", rev = "6a399f9260ebbb278cc180a23c89dc73323ee5f5" }
voting-crypto-deps = { git = "https://github.com/zodl-inc/voting-circuits", rev = "6a399f9260ebbb278cc180a23c89dc73323ee5f5" }
imt-tree = { git = "https://github.com/zodl-inc/voting-circuits", rev = "6a399f9260ebbb278cc180a23c89dc73323ee5f5" }
# valargroup/vote-nullifier-pir#173
pir-types = { git = "https://github.com/zodl-inc/vote-nullifier-pir", rev = "74327f9073e310b2b915d30f2a3c4d7918db7778" }
pir-client = { git = "https://github.com/zodl-inc/vote-nullifier-pir", rev = "74327f9073e310b2b915d30f2a3c4d7918db7778" }
# zakura-core/wallet-libraries#83
zakura-wallet-lib = { git = "https://github.com/zodl-inc/zakura-wallet-libraries", rev = "29fa15e0ca839d8a6807721ea7275f0994f09b72" }

# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
# The `zcash_client_sqlite-0.23.0-pre.1` tag plus a cherry-pick of zcash/librustzcash#3139 (merged
# upstream as 357359a4), which adds `WalletWrite::set_account_name`, on the
# feature/account-rename-trait-0.23.0-pre.1 branch.
equihash = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "68b2cf1f22d03a82271e0a3072350cfce9761532" }

# The Ledger tests build the Orchard proving key once, to extract and verify a proof-bearing
# transaction a device signed. Key generation synthesizes the Orchard circuit, which takes minutes
# in unoptimized halo2 and curve arithmetic and seconds optimized, so the test profile optimizes
# those crates; nothing else, and no other profile, changes.
[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.ff]
opt-level = 3
[profile.test.package.group]
opt-level = 3
