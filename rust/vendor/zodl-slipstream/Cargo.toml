[package]
edition = "2024"
rust-version = "1.90"
name = "zodl-slipstream"
version = "0.2.0"
authors = [
    "Lukas Korba <lukas.korba@seznam.cz>",
    "Kris Nuttycombe <kris@electriccoin.co>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-performance zcash light wallet sync engine"
homepage = "https://github.com/zodl-inc/slipstream"
readme = false
categories = ["cryptography::cryptocurrencies"]
license = "AGPL-3.0-only"
repository = "https://github.com/zodl-inc/slipstream"

# Own workspace root: this crate is vendored inside backend-lib (a single-package workspace)
# and consumed through [patch.crates-io]; it must not be treated as a stray member.
[workspace]

[features]
darkside = ["zcash_client_sqlite"]
default = ["zcash_client_sqlite"]
gpu = [
    "dep:slipstream-gpuhash",
    "zcash_client_sqlite",
]
zcash_client_sqlite = [
    "dep:zcash_client_sqlite",
    "dep:rusqlite",
    "dep:schemerz",
    "dep:schemerz-rusqlite",
    "dep:uuid",
]

[lib]
name = "zodl_slipstream"
path = "src/lib.rs"

[[test]]
name = "census_scan"
path = "tests/census_scan.rs"
required-features = ["zcash_client_sqlite"]

[[test]]
name = "darkside_follow"
path = "tests/darkside_follow.rs"
required-features = ["darkside"]

[[test]]
name = "darkside_oracle"
path = "tests/darkside_oracle.rs"
required-features = ["darkside"]

[[test]]
name = "darkside_reorg"
path = "tests/darkside_reorg.rs"
required-features = ["darkside"]

[[test]]
name = "darkside_sync"
path = "tests/darkside_sync.rs"
required-features = ["darkside"]

[[test]]
name = "darkside_transport"
path = "tests/darkside_transport.rs"
required-features = ["darkside"]

[[test]]
name = "stress_sparse_join"
path = "tests/stress_sparse_join.rs"
required-features = ["zcash_client_sqlite"]

[[test]]
name = "tor_runtime_spike"
path = "tests/tor_runtime_spike.rs"

