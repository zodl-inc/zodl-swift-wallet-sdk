name: Build FFI XCFramework

on:
  # Manual trigger for preparing releases.
  # The branch selected in the GitHub UI determines which commit is checked out and built.
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (e.g., 2.5.0)'
        required: true
      expected_source_sha:
        description: 'Optional exact source commit expected by the caller'
        required: false
        type: string
      request_id:
        description: 'Optional release request correlation (32 lowercase hex characters)'
        required: false
        type: string
      force:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

run-name: Build FFI ${{ inputs.version }} ${{ inputs.request_id }}

permissions: {}

jobs:
  build-xcframework:
    env:
      ZODL_OHTTP_REQUIRE: '1'
      ZODL_OHTTP_GATEWAY_HOST_MAINNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_MAINNET }}
      ZODL_OHTTP_GATEWAY_HOST_TESTNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_TESTNET }}
      ZODL_OHTTP_RELAY_URL_MAINNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_MAINNET }}
      ZODL_OHTTP_RELAY_URL_TESTNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_TESTNET }}
      ZODL_OHTTP_SIGNING_PUBKEY_MAINNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_MAINNET }}
      ZODL_OHTTP_SIGNING_PUBKEY_TESTNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_TESTNET }}
      ZODL_OHTTP_KEYS_DNS_NAME_MAINNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_MAINNET }}
      ZODL_OHTTP_KEYS_DNS_NAME_TESTNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_TESTNET }}
    # Xcode 27 ships only on this image, which GitHub still marks as a public
    # preview (https://github.com/actions/runner-images/issues/14404). If it
    # misbehaves, macos-26 with Xcode 26.6 is the fallback.
    runs-on: xcode-27
    permissions:
      contents: write # Required for creating draft releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Report Xcode and compute cache identity
        id: xcode-cache-key
        run: |
          xcode_version_file=$(mktemp)
          trap 'rm -f "$xcode_version_file"' EXIT
          xcodebuild -version -skipMacroValidation -derivedDataPath "${RUNNER_TEMP}/DerivedData" > "$xcode_version_file"
          cat "$xcode_version_file"
          echo "hash=$(shasum -a 256 "$xcode_version_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Authorize cargo against the private slipstream repository
        uses: ./.github/actions/authorize-slipstream
        with:
          app-id: ${{ secrets.SLIPSTREAM_APP_ID || secrets.CARGO_PRIVATE_APP_ID }}
          app-private-key: ${{ secrets.SLIPSTREAM_APP_PRIVATE_KEY || secrets.CARGO_PRIVATE_APP_KEY }}

      # Release builds support all three ARM64 Apple platforms.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Validate Rust
        id: toolchain
        run: |
          python3 Scripts/ci/rust_toolchain.py --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT" --github-path "$GITHUB_PATH"

      - name: Validate OHTTP configuration
        id: ohttp-config
        run: |
          OHTTP_HASH=$(python3 Scripts/lib/ohttp_env.py --hash)
          echo "hash=$OHTTP_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
          # Swatinem/rust-cache did): that includes `~/.cargo/git`, where cargo keeps its clones of
          # git dependencies. Every git dependency on main is public today (slipstream, once a
          # private git dependency, now comes from crates.io), but a private one can return — other
          # branches already pull some — and the public twin of this repository lets workflow runs
          # from forked pull requests restore caches created on main. A cached clone would hand those
          # runs the private source without their ever holding a credential for it, so the clones are
          # fetched afresh on every run instead.
          #
          # `registry/` is crates.io content and safe to cache. `target/` holds compiled rlib/rmeta
          # files, never sources: a far smaller disclosure should a private dependency return, and
          # too expensive to rebuild every run.
          path: |
            target
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-key.outputs.hash }}-cargo-release-arm64-slices-lto-v3-${{ steps.toolchain.outputs.cachekey }}-${{ steps.ohttp-config.outputs.hash }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-key.outputs.hash }}-cargo-release-arm64-slices-lto-v3-${{ steps.toolchain.outputs.cachekey }}-${{ steps.ohttp-config.outputs.hash }}-

      - name: Build and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force }}
          ZODL_SDK_BUILD_RECORD: '1'
          ZODL_SDK_EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
          ZODL_SDK_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [ "$FORCE" = "true" ]; then
            ./Scripts/prepare-release.sh artifacts --force-overwrite-existing-release "$VERSION"
          else
            ./Scripts/prepare-release.sh artifacts "$VERSION"
          fi

      - name: Report the release artifacts
        run: |
          source BuildSupport/products/release.env
          echo ""
          echo "========================================"
          echo "Draft release ${VERSION} now carries:"
          echo "========================================"
          echo ""
          echo "url:      ${DOWNLOAD_URL}"
          echo "checksum: ${CHECKSUM}"
          echo ""
          echo "From a checkout on candidate/${VERSION}, run:"
          echo "  ./Scripts/prepare-release.sh build --artifacts ci <remote> ${VERSION}"
          echo ""
          echo "It will find this draft release, reuse its checksum, write"
          echo "Package.swift, and mark the release PR ready for review."
