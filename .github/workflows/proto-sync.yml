name: Proto Sync

# Sources/ZODLSwiftWalletSDK/Modules/Service/GRPC/ProtoBuf/proto/proposal.proto
# is vendored from librustzcash. libzcashlc encodes proposals with the schema of
# the pinned zcash_client_backend, so a stale copy silently drops fields on the
# Swift side. Re-derive it from the pinned version and fail if the committed
# copy differs.

on:
  pull_request:

permissions: {}

jobs:
  check_proposal_proto:
    permissions:
      contents: read
      pull-requests: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Classify PR changes
      id: changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 Scripts/ci/pr_change_filter.py --profile sdk-proto --github-output "$GITHUB_OUTPUT"

    - name: Check proposal.proto matches the pinned zcash_client_backend
      if: steps.changes.outputs.run_ci == 'true'
      timeout-minutes: 5
      run: ./Scripts/update-proposal-proto.sh --check
